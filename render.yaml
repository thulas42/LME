services:
  - type: web
    name: creditedge-api
    env: node
    plan: free
    buildCommand: cd server && NODE_ENV=development npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
